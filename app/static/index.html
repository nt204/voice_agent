<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Sales Admin</title>
  <link rel="stylesheet" href="/static/dashboard.css?v=layout-6">
</head>
<body>
  <main class="dashboard-shell">
    <header class="app-header">
      <div>
        <h1>Voice AI Sales</h1>
        <span id="syncStatus">Đang tải</span>
      </div>
      <button id="refreshButton" class="icon-button" type="button" aria-label="Làm mới">↻</button>
    </header>

    <section class="top-controls" aria-label="Bộ lọc và gọi khách hàng">
      <section class="control-card funnel-card">
        <div class="panel-heading">
          <h2>Phễu sales</h2>
        </div>
        <div class="funnel-list">
          <button class="funnel-item active" data-interest="" type="button">
            <span>Tất cả</span><strong id="funnelAll">0</strong>
          </button>
          <button class="funnel-item hot" data-interest="needs_consultation" type="button">
            <span>Cần tư vấn</span><strong id="funnelHot">0</strong>
          </button>
          <button class="funnel-item cold" data-interest="no_need" type="button">
            <span>Chưa có nhu cầu</span><strong id="funnelCold">0</strong>
          </button>
          <button class="funnel-item neutral" data-interest="unknown" type="button">
            <span>Chưa xác định</span><strong id="funnelUnknown">0</strong>
          </button>
        </div>
      </section>

      <section class="control-card channel-card">
        <div class="panel-heading">
          <h2>Kênh gọi</h2>
        </div>
        <div class="segment-control" aria-label="Lọc hướng cuộc gọi">
          <button class="segment active" data-direction="" type="button">Tất cả</button>
          <button class="segment" data-direction="inbound" type="button">Gọi vào</button>
          <button class="segment" data-direction="outbound" type="button">Gọi ra</button>
        </div>
      </section>

      <section class="control-card call-card">
        <div class="panel-heading">
          <h2>Gọi nhanh khách hàng</h2>
        </div>
        <form id="outboundCallForm" class="call-form">
          <label class="phone-field">
            <span>Số khách hàng</span>
            <input id="toNumberInput" name="to_number" type="tel" placeholder="Nhập số điện thoại khách hàng" autocomplete="tel" required>
          </label>
          <button id="startCallButton" class="call-button" type="submit">Bắt đầu gọi</button>
          <p id="outboundCallStatus" class="form-status" role="status"></p>
        </form>
      </section>
    </section>

    <section class="admin-grid">
      <aside class="order-panel">
        <div class="panel-heading">
          <h2>Đơn hàng đã tạo</h2>
        </div>
        <div id="orderList" class="order-list" aria-live="polite"></div>
        <div class="panel-footer order-footer">
          <span id="orderRange">0 đơn</span>
          <div id="orderPager" class="pager" aria-label="Phân trang đơn hàng"></div>
        </div>
      </aside>

      <section class="work-panel">
        <div class="toolbar">
          <label class="search-field">
            <span class="sr-only">Tìm kiếm lead</span>
            <input id="searchInput" type="search" placeholder="Tìm tên, số điện thoại, nhu cầu..." autocomplete="off">
          </label>
          <div class="toolbar-meta">
            <span id="resultCount">0 kết quả</span>
          </div>
        </div>

        <div class="lead-list-wrap">
          <div class="table-head">
            <span>Lead</span>
            <span>Nhu cầu</span>
            <span>Trạng thái</span>
            <span>Thời gian</span>
            <span>Loại</span>
          </div>
          <div id="callList" class="lead-list" aria-live="polite"></div>
        </div>

        <div class="table-footer">
          <span id="visibleRange">Hiển thị 0 kết quả</span>
          <div id="callPager" class="pager" aria-label="Phân trang cuộc gọi"></div>
        </div>
      </section>

      <aside id="detailPanel" class="detail-panel">
        <div class="empty-state">
          <div class="empty-mark" aria-hidden="true"></div>
          <h2>Chọn một lead</h2>
        </div>
      </aside>
    </section>
  </main>

  <template id="loadingTemplate">
    <div class="list-state">Đang tải dữ liệu...</div>
  </template>
  <template id="emptyTemplate">
    <div class="list-state">
      <strong>Chưa có cuộc gọi</strong>
    </div>
  </template>
  <script src="/static/dashboard.js?v=layout-6" defer></script>
</body>
</html>
