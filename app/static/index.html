<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Sales Admin</title>
  <link rel="stylesheet" href="/static/dashboard.css?v=layout-9">
</head>
<body>
  <main class="dashboard-shell">
    <header class="app-header">
      <div>
        <h1>Voice AI Sales</h1>
        <span id="syncStatus">Loading</span>
      </div>
      <button id="refreshButton" class="icon-button" type="button" aria-label="Refresh">↻</button>
    </header>

    <section class="top-controls" aria-label="Filters and customer calling">
      <section class="control-card funnel-card">
        <div class="panel-heading">
          <h2>Sales funnel</h2>
        </div>
        <div class="funnel-list">
          <button class="funnel-item active" data-interest="" type="button">
            <span>All</span><strong id="funnelAll">0</strong>
          </button>
          <button class="funnel-item hot" data-interest="needs_consultation" type="button">
            <span>Needs consultation</span><strong id="funnelHot">0</strong>
          </button>
          <button class="funnel-item cold" data-interest="no_need" type="button">
            <span>No need</span><strong id="funnelCold">0</strong>
          </button>
          <button class="funnel-item neutral" data-interest="unknown" type="button">
            <span>Unknown</span><strong id="funnelUnknown">0</strong>
          </button>
        </div>
      </section>

      <section class="control-card channel-card">
        <div class="panel-heading">
          <h2>Call channel</h2>
        </div>
        <div class="segment-control" aria-label="Filter call direction">
          <button class="segment active" data-direction="" type="button">All</button>
          <button class="segment" data-direction="inbound" type="button">Inbound</button>
          <button class="segment" data-direction="outbound" type="button">Outbound</button>
        </div>
      </section>

      <section class="control-card call-card">
        <div class="panel-heading">
          <h2>Quick customer call</h2>
        </div>
        <form id="outboundCallForm" class="call-form">
          <label class="phone-field">
            <span>Customer phone</span>
            <input id="toNumberInput" name="to_number" type="tel" placeholder="+959..., +849..., 84..., VN 09..." autocomplete="tel" required>
          </label>
          <button id="startCallButton" class="call-button" type="submit">Start call</button>
          <p id="outboundCallStatus" class="form-status" role="status"></p>
        </form>
      </section>
    </section>

    <section class="admin-grid">
      <aside class="order-panel">
        <div class="panel-heading">
          <h2>Created orders</h2>
        </div>
        <div id="orderList" class="order-list" aria-live="polite"></div>
        <div class="panel-footer order-footer">
          <span id="orderRange">0 orders</span>
          <div id="orderPager" class="pager" aria-label="Order pagination"></div>
        </div>
      </aside>

      <section class="work-panel">
        <div class="toolbar">
          <label class="search-field">
            <span class="sr-only">Search leads</span>
            <input id="searchInput" type="search" placeholder="Search name, phone, need..." autocomplete="off">
          </label>
          <div class="toolbar-meta">
            <span id="resultCount">0 results</span>
          </div>
        </div>

        <div class="lead-list-wrap">
          <div class="table-head">
            <span>Lead</span>
            <span>Need</span>
            <span>Status</span>
            <span>Time</span>
            <span>Type</span>
          </div>
          <div id="callList" class="lead-list" aria-live="polite"></div>
        </div>

        <div class="table-footer">
          <span id="visibleRange">Showing 0 results</span>
          <div id="callPager" class="pager" aria-label="Call pagination"></div>
        </div>
      </section>

      <aside id="detailPanel" class="detail-panel">
        <div class="empty-state">
          <div class="empty-mark" aria-hidden="true"></div>
          <h2>Select a lead</h2>
        </div>
      </aside>
    </section>
  </main>

  <template id="loadingTemplate">
    <div class="list-state">Loading data...</div>
  </template>
  <template id="emptyTemplate">
    <div class="list-state">
      <strong>No calls yet</strong>
    </div>
  </template>
  <script src="/static/dashboard.js?v=layout-9" defer></script>
</body>
</html>
