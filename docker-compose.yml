services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/recordings.db
      CALL_RECORDINGS_DIR: /app/recordings
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
      - app_recordings:/app/recordings
      - ./assets:/app/assets:ro
    restart: unless-stopped

volumes:
  app_data:
  app_recordings:
