services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice}
      POSTGRES_USER: ${POSTGRES_USER:-voice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voice} -d ${POSTGRES_DB:-voice}"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD:-voice_local}@postgres:5432/${POSTGRES_DB:-voice}
      CALL_RECORDINGS_DIR: /app/recordings
      GEMINI_ORDER_EXTRACTION_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
      - app_recordings:/app/recordings
      - ./assets:/app/assets:ro
    restart: unless-stopped

volumes:
  app_data:
  app_recordings:
  postgres_data:
