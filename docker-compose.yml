services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telnyx_calls
      POSTGRES_USER: telnyx
      POSTGRES_PASSWORD: telnyx_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telnyx -d telnyx_calls"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
